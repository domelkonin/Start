<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; }
        .product-card { background: #fff; border-radius: 8px; padding: 1.2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; }
        .product-card-image { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.8rem; overflow: hidden; border-radius: 4px; background: #f5f5f5; }
        .product-card-image img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
        .product-card h3 { font-size: 1rem; line-height: 1.35; min-height: 2.5em; color: #1a1a1a; margin-bottom: 0.4rem; }
        .opis { font-size: 0.88rem; color: #555; margin: 0.3rem 0 0.5rem; flex: 1; }
        .cena { display: block; font-weight: 700; color: #e11d48; margin-bottom: 0.5rem; }
        .availability { font-size: 0.85rem; color: #16a34a; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .availability-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-local { background: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,0.25); }
        .btn-add-cart { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 0.5rem; padding: 0.65rem 1rem; border: none; border-radius: 6px; background: #0ea5e9; color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
        .btn-add-cart:hover { background: #0284c7; }
        .page-title { text-align: center; margin-bottom: 0.5rem; }
        #lightbox { display: none; position: fixed; z-index: 9999; inset: 0; background: rgba(0,0,0,.85); align-items: center; justify-content: center; padding: 1rem; cursor: zoom-out; }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: min(96vw, 1000px); max-height: 90vh; object-fit: contain; border-radius: 6px; }
        #lightbox .lb-close { position: absolute; top: 16px; right: 22px; color: #fff; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="top"><div class="container top-container"><div class="top-info">
        <a href="https://www.google.com/maps/place/Aleje+1+Maja+15,+62-510+Konin" target="_blank" class="top-link"><i class="fa-solid fa-location-dot"></i> al. 1 Maja 15 | 62-510 Konin</a>
        <a href="tel:696085262" class="top-link phone-link"><i class="fa-solid fa-phone"></i> 696 085 262</a>
    </div><div class="top-social">
        <a href="https://www.facebook.com/profile.php?id=61594405195116" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/outletdomel/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    </div></div></div>
    <header id="border"><div class="container header-container">
        <div class="logo-wrapper"><a href="index.html"><img src="images/logo.png" alt="Domel Konin"></a></div>
        <nav id="menu"><ul>
            <li><a href="index.html">STRONA GŁÓWNA</a></li>
            <li><a href="sprzedaz.html" style="color:#00b4ff;">SPRZEDAŻ AGD</a></li>
            <li><a href="magazyn.html">MAGAZYN</a></li>
            <li><a href="promocje.html">PROMOCJE DNIA</a></li>
            <li><a href="koszyk.html">KOSZYK</a></li>
            <li><a href="index.html#contact">KONTAKT</a></li>
        </ul></nav>
    </div></header>
    <section class="section-padding"><div class="container">
        <h2 class="page-title">Lodówki</h2>
        <p class="section-desc">Lodówki wolnostojące i do zabudowy. Dodaj produkt do koszyka i poproś o wycenę.</p>
        <div class="category-search" style="margin:0 auto 1.5rem">
            <input type="text" id="catSearchInput" placeholder="Szukaj lodówki..." oninput="filterCatProducts()" autocomplete="off">
            <button type="button" onclick="filterCatProducts()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div id="noResults" class="no-results">Brak pasujących produktów</div>
        <div class="products-grid" id="products-grid"></div>
    </div></section>
    <footer><div class="container footer-content"><p>&copy; 2026 DOMEL Konin - Sprzedaż i Serwis AGD.</p></div></footer>
    <div id="lightbox" onclick="closeLightbox()"><span class="lb-close">&times;</span><img id="lightbox-img" src="" alt=""></div>
    <script src="cart.js"></script>
    <script>
        const products = [
            {"title": "Candy CCG1L314EW", "img": "images/zdjecia_produktow/lodowki/Candy_CCG1L314EW.jpg", "desc": "Lodówka Candy CCG1L314EW z oferty outletowej Domel. Wymiary 144 x 47 x 49,5 cm, pojemność 109 l chłodziarka + 48 l zamrażarka, klasa energetyczna E, poziom hałasu 39 dB. Funkcja szybkiego zamrażania.", "price": "1400 zł"},
            {"title": "Kernau KFRC 13153.3 LF W", "img": "images/zdjecia_produktow/lodowki/Kernau_KFRC_13153_3_LF_W1.jpg"},
            {"title": "Kernau KFRC 18153 W", "img": "images/zdjecia_produktow/lodowki/Kernau_KFRC_18153_W.jpg", "desc": "Lodówka Kernau KFRC 18153 W z oferty outletowej Domel. Wymiary 180 x 55 x 56 cm, pojemność 109 l chłodziarka + 48 l zamrażarka, klasa energetyczna E, poziom hałasu 40 dB. Funkcja szybkiego zamrażania.", "price": "1250 zł"},
            {"title": "SAMSUNG RB38C605CB1", "img": "images/zdjecia_produktow/lodowki/SAMSUNG_RB38C605CB1.jpg", "desc": "Lodówka Samsung RB38C605CB1 z oferty outletowej Domel. Wymiary 202 x 59,5 x 68,8 cm, pojemność 278 l chłodziarka + 114 l zamrażarka, klasa energetyczna C, poziom hałasu 35 dB. System No Frost, kompresor Optimal Fresh+.", "price": "2700 zł"},
            {"title": "Samsung Combi Max RB53DG706AB1EO", "img": "images/zdjecia_produktow/lodowki/Samsung_Combi_Max_RB53DG706AB1EO.jpg", "desc": "Lodówka Samsung Combi Max RB53DG706AB1EO z oferty outletowej Domel. Chłodziarka 389 l (378 l netto) + zamrażalnik 168 l, klasa energetyczna A (128 kWh/rok), poziom hałasu 34 dB. No Frost, Twin Cooling Plus, Metal Cooling, kompresor Digital Inverter, Wi-Fi (SmartThings). Cena internetowa 4560 zł, nasza cena 4000 zł.", "price": "4000 zł"},
            {"title": "Samsung French Door", "img": "images/zdjecia_produktow/lodowki/Samsung_French_Door.png", "desc": "Lodówka Samsung French Door RF48A00EB4 z oferty outletowej Domel. Wymiary 179,3 x 83,3 x 74 cm, pojemność 488 l (329 l chłodziarka / 159 l zamrażalnik), klasa energetyczna E (299 kWh/rok), poziom hałasu 41 dB. No Frost, Twin Cooling Plus, automatyczna kostkarka, czarny stalowy design. Cena internetowa 4000 zł, nasza cena 3400 zł.", "price": "3400 zł"},
            {"title": "Samsung RB33B610EWW", "img": "images/zdjecia_produktow/lodowki/Samsung_RB33B610EWW.jpg", "desc": "Lodówka Samsung SpaceMax RB33B610EWW z oferty outletowej Domel. Wymiary 185,3 x 59,8 x 65,8 cm, pojemność 341 l (320 l netto) + 114 l zamrażalnik, klasa energetyczna E (254 kWh/rok), poziom hałasu 35 dB. No Frost, SpaceMax, All-Around Cooling, kompresor Digital Inverter, wykończenie Clean Back. Cena internetowa 2500 zł, nasza cena 1900 zł.", "price": "1900 zł"},
            {"title": "Samsung RB38C776CB1EF", "img": "images/zdjecia_produktow/lodowki/Samsung_RB38C776CB1EF.jpg", "desc": "Lodówka Samsung RB38C776CB1 EF z oferty outletowej Domel. Wymiary 203 x 59,5 x 65,4 cm, pojemność 276 l chłodziarka + 114 l zamrażarka, klasa energetyczna C, poziom hałasu 35 dB. System No Frost, Metal Cooling.", "price": "3100 zł"},
            {"title": "Samsung RB7300T Rb38C762CWW", "img": "images/zdjecia_produktow/lodowki/Samsung_RB7300T_Rb38C762CWW.jpg", "desc": "Lodówka Samsung RB7300T RB38C762CWW z oferty outletowej Domel. Wysokość 182 cm, układ dolny zamrażalnik.", "price": "2500 zł"},
            {"title": "Samsung RB38C776CB1", "img": "images/zdjecia_produktow/lodowki/samsung_RB38C776CB1.jpg", "desc": "Lodówka Samsung RB38C776CB1 z oferty outletowej Domel. Wymiary 201 x 59,5 x 65,4 cm, pojemność 274 l chłodziarka + 114 l zamrażarka, klasa energetyczna C, poziom hałasu 35 dB. System No Frost, zintegrowana pojemność.", "price": "3100 zł"},
        ];
        const grid = document.getElementById('products-grid');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('data-title', p.title.toLowerCase());
            card.innerHTML = `<div class="product-card-image"><img src="${p.img}" alt="${p.title}" onclick="openLightbox(this.src)" onerror="this.src='images/logo.png'"></div>
                <div class="availability"><span class="availability-dot dot-local"></span> Dostępny lokalnie</div>
                <h3>${p.title}</h3>
                <p class="opis">${p.desc || 'Produkt dostępny w salonie Domel Konin.'}</p>
                <span class="cena">${p.price || 'Cena na zapytanie'}</span>
                <button type="button" class="btn-add-cart" data-add-to-cart data-title="${p.title}" data-price="${p.price || 'Cena na zapytanie'}" data-image="${p.img}"><i class="fa-solid fa-cart-plus"></i> Dodaj do koszyka</button>`;
            grid.appendChild(card);
        });
        function filterCatProducts() {
            const val = (document.getElementById('catSearchInput').value || '').toLowerCase().trim();
            let visible = 0;
            document.querySelectorAll('.product-card').forEach(card => {
                const ok = !val || (card.getAttribute('data-title') || '').includes(val);
                card.style.display = ok ? '' : 'none';
                if (ok) visible++;
            });
            const noRes = document.getElementById('noResults');
            if (noRes) noRes.style.display = (visible === 0 && val) ? 'block' : 'none';
        }
        function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.add('open'); }
        function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
    </script>
</body>
</html>
