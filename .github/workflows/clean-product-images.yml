name: Wyczyść etykiety ze zdjęć produktów

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pillow
        run: pip install Pillow

      - name: Kadrowanie etykiet cenowych
        run: python scripts/clean_product_images.py

      - name: Commit
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --staged --quiet; then
            echo "Brak zmian"
          else
            git commit -m "Wyczyszczone etykiety cenowe ze zdjęć produktów"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
