name: Aktualizacja promocji dnia (B2B GT)

on:
  schedule:
    # Codziennie o 4:00 UTC ≈ 5:00/6:00 czasu polskiego
    - cron: '0 4 * * *'
  workflow_dispatch:  # Ręczne uruchomienie z przycisku w GitHubie

permissions:
  contents: write

jobs:
  aktualizuj-promocje:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja Playwright i zależności
        run: |
          pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Sprawdź secrets logowania B2B
        env:
          GT_B2B_EMAIL: ${{ secrets.GT_B2B_EMAIL }}
          GT_B2B_PASSWORD: ${{ secrets.GT_B2B_PASSWORD }}
        run: |
          if [ -z "$GT_B2B_EMAIL" ] || [ -z "$GT_B2B_PASSWORD" ]; then
            echo "BŁĄD: Brak secrets GT_B2B_EMAIL lub GT_B2B_PASSWORD."
            echo "Ustaw je w: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Secrets obecne (email: ${GT_B2B_EMAIL:0:3}***)."

      - name: Pobieranie promocji z B2B GT
        env:
          GT_B2B_EMAIL: ${{ secrets.GT_B2B_EMAIL }}
          GT_B2B_PASSWORD: ${{ secrets.GT_B2B_PASSWORD }}
        run: |
          python download_promocje_b2b.py --margin 10

      - name: Generowanie promocje.html
        run: |
          python regenerate_promocje_html.py

      - name: Commit i push zmian
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add promocje.json promocje.html images/promocje/ || true

          if git diff --staged --quiet; then
            echo "Brak zmian w promocjach – pomijam commit."
            exit 0
          fi

          git commit -m "Automatyczna aktualizacja promocji dnia $(date -u +%Y-%m-%d)"

          # Remote mógł dostać nowe commity w trakcie joba – najpierw zsynchronizuj
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Push OK – strona na GitHub Pages odświeży się za 1–2 min."
