<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domel Konin - Piekarniki</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}
.product-card{background:#fff;border-radius:8px;padding:1.2rem;box-shadow:0 2px 5px rgba(0,0,0,.1);text-align:center;display:flex;flex-direction:column}
.product-card-image{width:100%;height:220px;display:flex;align-items:center;justify-content:center;margin-bottom:.8rem;overflow:hidden;border-radius:4px;background:#f5f5f5}
.product-card-image img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.product-card h3{font-size:1rem;line-height:1.35;min-height:2.5em}
.opis{font-size:.88rem;color:#555;margin:.3rem 0 .5rem;flex:1}
.cena{display:block;font-weight:700;color:#e11d48;margin-bottom:.5rem}
.btn-add-cart{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:.5rem;padding:.65rem 1rem;border:none;border-radius:6px;background:#0ea5e9;color:#fff;font-weight:600;cursor:pointer}
.page-title{text-align:center}
#lightbox{display:none;position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:min(96vw,1000px);max-height:90vh;object-fit:contain}
</style>
</head>
<body>
<div id="top"><div class="container top-container"><div class="top-info">
<a href="https://www.google.com/maps/place/Aleje+1+Maja+15,+62-510+Konin" target="_blank" class="top-link"><i class="fa-solid fa-location-dot"></i> al. 1 Maja 15 | 62-510 Konin</a>
<a href="tel:696085262" class="top-link phone-link"><i class="fa-solid fa-phone"></i> 696 085 262</a>
</div><div class="top-social">
<a href="https://www.facebook.com/profile.php?id=61594405195116" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
<a href="https://www.instagram.com/outletdomel/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
</div></div></div>
<header id="border"><div class="container header-container">
<div class="logo-wrapper"><a href="index.html"><img src="images/logo.png" alt="Domel Konin"></a></div>
<nav id="menu"><ul>
<li><a href="index.html">STRONA GŁÓWNA</a></li>
<li><a href="sprzedaz.html" style="color:#00b4ff;">SPRZEDAŻ AGD</a></li>
<li><a href="magazyn.html">MAGAZYN</a></li>
<li><a href="promocje.html">PROMOCJE DNIA</a></li>
<li><a href="koszyk.html">KOSZYK</a></li>
<li><a href="index.html#contact">KONTAKT</a></li>
</ul></nav></div></header>
<section class="section-padding"><div class="container">
<h2 class="page-title">Piekarniki</h2>
<p class="section-desc">Piekarniki elektryczne i zestawy. Dodaj do koszyka i poproś o wycenę.</p>
<div class="category-search" style="margin:0 auto 1.5rem"><input type="text" id="catSearchInput" placeholder="Szukaj piekarnika..." oninput="filterCatProducts()" autocomplete="off">
<button type="button" onclick="filterCatProducts()"><i class="fa-solid fa-magnifying-glass"></i></button></div>
<div id="noResults" class="no-results">Brak pasujących produktów</div>
<div class="products-grid" id="products-grid"></div>
</div></section>
<footer><div class="container footer-content"><p>&copy; 2026 DOMEL Konin - Sprzedaż i Serwis AGD.</p></div></footer>
<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src="" alt=""></div>
<script src="cart.js"></script>
<script>
const products=[
{title:"Amica 6018GG4.43HZpFQ(Xx)",img:"images/zdjecia_produktow/pierkarniki/Amica_6018GG4_43HZpFQ_Xx.jpg"},
{title:"Electrolux LKK640221W",img:"images/zdjecia_produktow/pierkarniki/Electrolux_LKK640221W.jpg"},
{title:"Gorenje GKS5C71XF (G600)",img:"images/zdjecia_produktow/pierkarniki/Gorenje_GKS5C71XF_G600.jpg"},
{title:"Electrolux EOD6C71X",img:"images/zdjecia_produktow/pierkarniki/Electrolux_EOD6C71X.jpg",desc:"Piekarnik elektryczny do zabudowy, 72 l, klasa A+, czyszczenie katalityczne, 3480 W, SteamBake, Termosonda, Termoobieg. Nowy, gwarancja 12 mies.",price:"1900 zł (zamiast 2200 zł)"},
{title:"Electrolux COD8H39Z",img:"images/zdjecia_produktow/pierkarniki/Electrolux_COD8H39Z.jpg",desc:"Piekarnik elektryczny do zabudowy, czarny szkło, 72 l, klasa A+, czyszczenie Aqua Clean, 3490 W, SteamBake, Termosonda, TFT. Nowy, gwarancja 12 mies.",price:"2200 zł (zamiast 2500 zł)"}
];
const grid=document.getElementById('products-grid');
products.forEach(p=>{const c=document.createElement('div');c.className='product-card';c.setAttribute('data-title',p.title.toLowerCase());
c.innerHTML=`<div class="product-card-image"><img src="${p.img}" alt="${p.title}" onclick="openLightbox(this.src)" onerror="this.src='images/logo.png'"></div>
<div class="availability">● Dostępny lokalnie</div><h3>${p.title}</h3><p class="opis">${p.desc||'Produkt dostępny w salonie Domel Konin.'}</p><span class="cena">${p.price||'Cena na zapytanie'}</span>
<button type="button" class="btn-add-cart" data-add-to-cart data-title="${p.title}" data-price="${p.price||'Cena na zapytanie'}" data-image="${p.img}"><i class="fa-solid fa-cart-plus"></i> Dodaj do koszyka</button>`;grid.appendChild(c)});
function filterCatProducts(){const v=(document.getElementById('catSearchInput').value||'').toLowerCase().trim();let n=0;document.querySelectorAll('.product-card').forEach(c=>{const ok=!v||(c.getAttribute('data-title')||'').includes(v);c.style.display=ok?'':'none';if(ok)n++});const nr=document.getElementById('noResults');if(nr)nr.style.display=(n===0&&v)?'block':'none'}
function openLightbox(s){document.getElementById('lightbox-img').src=s;document.getElementById('lightbox').classList.add('open')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}
</script>
</body></html>
